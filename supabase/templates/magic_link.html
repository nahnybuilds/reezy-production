<!-- Reezy sign-in code (D39: email one-time code, no passwords). Plain and quiet on purpose. -->
<div style="font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; color: #1C1A1F; max-width: 480px;">
  <p style="font-size: 17px; line-height: 24px;">Here's your code to sign in to Reezy:</p>
  <p style="font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: 6px; color: #660045;">{{ .Token }}</p>
  <p style="font-size: 13px; line-height: 18px; color: #6B6470;">It expires in 10 minutes. If you didn't ask for it, you can ignore this email.</p>
</div>
